# Environment (passed to xrl_nav.envs.NavEnv)
env:
  n_rays: 24
  max_range: 4.0
  arena_half: 5.0
  dt: 0.2
  max_steps: 400
  goal_radius: 0.35
  terminate_on_collision: true
  reward_cfg:
    progress: 3.0
    step: -0.005
    goal: 10.0
    collision: -10.0
    proximity: -0.1
    proximity_dist: 0.3

# Experiments run by scripts/run_all.sh  (label: settings)
experiments:
  ppo_mlp:       {algo: ppo, policy: mlp,       continuous: false, timesteps: 500000, seeds: [0, 1, 2], n_envs: 8}
  ppo_attention: {algo: ppo, policy: attention, continuous: false, timesteps: 500000, seeds: [0],       n_envs: 8}
  dqn_mlp:       {algo: dqn, policy: mlp,       continuous: false, timesteps: 300000, seeds: [0],       n_envs: 1}
  ppo_mlp_cont:  {algo: ppo, policy: mlp,       continuous: true,  timesteps: 500000, seeds: [0],       n_envs: 8}

evaluation:
  episodes: 100          # per split
  scenario_episodes: 10  # per hand-designed scenario (start heading jittered)

explain:
  n_episodes: 30         # rollouts used to build the state dataset
  n_states: 400          # states sampled for the expensive analyses
